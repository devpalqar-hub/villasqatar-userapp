name: villas_qatar
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_localisation: ^2.1.2
